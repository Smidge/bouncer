name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88 (rust-version in Cargo.toml)
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - run: cargo test --locked
      - run: cargo build --locked --no-default-features

  # Dedicated-user mode under systemd: the daemon starts as root, drops to `bouncer`, keeps
  # the key in an encrypted credential, and an `agent` user is attributed across uids but
  # cannot read the vault, key or log.
  multiuser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo build --release
      - run: sudo ci/multiuser.sh target/release/bouncer systemd
      - name: Service log
        if: always()
        run: sudo journalctl -u bouncer --no-pager | tail -50

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and musl
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: ls -l target/x86_64-unknown-linux-musl/release/bouncer && file target/x86_64-unknown-linux-musl/release/bouncer
